# AÑADIDO (Hito 1): configuración de pytest (carpeta de tests, rutas de import y marcadores).
# CAMBIO (sesión 19): marcador s19 para tests/s19.
[pytest]
testpaths = tests
pythonpath =
    tests
    tests/hito1
markers =
    hito1: comprobaciones del Hito 1 (04/11) de la Entrega 2
    hito2: comprobaciones del Hito 2 (11/11) de la Entrega 2
    s19: sesión 19 (18/11): query temp-stream y ACTA_S19.md
    runtime: ejecuta el código actual del ETL (práctica 1) sin red
addopts = -ra
