# Configuración del ETL del observatorio (Práctica 1 → Hito 1 → Hito 2).
#
# CAMBIO (Hito 1): se mantienen activas las fuentes para construir el universo
# completo de países y sus indicadores, en lugar de limitarlo a cinco países.
# ANTES: solo 5 países fijos en focus_countries (ES, FR, DE, IT, PT).
# AHORA: no hay focus_countries; el catálogo de países sale del perfil global
# (countries_profile) filtrado con el criterio del bloque `countries`.
#
# Nombres de fichero en data/raw/:
#   url fija                         → data/raw/{id}.{format}
#   url_template con {iso2}/{iso3}   → data/raw/{id}_{iso2}.{format}   (formato antiguo)
#   url_template solo {indicator_id} → data/raw/{id}_{indicator_id}.{format}


# CAMBIO (Hito 2): criterio de país y equivalencias de código en configuración.
# ANTES: cualquier entrada del perfil con ISO válido era "país" (~250, incluidos
# territorios como Aruba o Gibraltar), y cada fuente casaba códigos a su manera.
# AHORA:
# 1. Se acepta una entrada del perfil si `independent: true` (194 estados).
# 2. `include_iso3` añade entidades con reconocimiento parcial que el Banco
#    Mundial trata como economía propia (Kosovo y Palestina).
# 3. Todo lo demás va a data/clean/excluded_entities.csv con su motivo.
# 4. `code_equivalences`: código que usa cada fuente → iso3 canónico del perfil.
#    POR QUÉ: Kosovo es UNK en el perfil, XKX en el Banco Mundial y OWID_KOS en
#    OWID; Eurostat usa EL para Grecia y UK para Reino Unido.
countries:
  accept_if_independent: true
  include_iso3: [UNK, PSE]
  exclude_iso3: []
  code_equivalences:
    worldbank:
      XKX: UNK
    eurostat_pop:
      EL: GRC
      UK: GBR
      XK: UNK
    owid_life_expectancy:
      OWID_KOS: UNK


sources:
  # CAMBIO (Hito 1): el perfil se descarga primero y sirve como catálogo ISO2/ISO3.
  # POR QUÉ: el criterio de país y el cruce del resto de fuentes dependen de él.
  - id: countries_profile
    name: mledoze/countries (perfil e idiomas)
    url: https://raw.githubusercontent.com/mledoze/countries/master/countries.json
    format: json
    role: profile
    transformer: countries_profile

  # CAMBIO (Hito 2): las dos fuentes del Banco Mundial (worldbank_gdp y
  # worldbank_pop) se unen en una sola fuente `worldbank` con petición de universo.
  # ANTES: url_template .../country/{iso2}/indicator/... → una petición por país
  #        (~200 países × 6 indicadores ≈ 1200 peticiones).
  # AHORA: .../country/all/indicator/{indicator_id} → una petición paginada por
  #        indicador (6 indicadores × pocas páginas). `paginate: worldbank` activa
  #        la paginación y la comprobación contra el `total` de la API.
  # per_page=5000: la API declara ~17 000 registros por indicador, así que
  # salen 4 páginas por indicador; respuestas de tamaño razonable (~1,5 MB).
  - id: worldbank
    name: World Bank — World Development Indicators (universo, serie completa)
    url_template: >-
      https://api.worldbank.org/v2/country/all/indicator/{indicator_id}?format=json&per_page=5000&page=1
    format: json
    role: indicator
    transformer: worldbank_indicator
    paginate: worldbank
    meta:
      aliases: [iso3]  # el Banco Mundial identifica cada fila con countryiso3code
      # CAMBIO (Hito 2): etiqueta y unidad propias de cada indicador.
      # ANTES: los cinco indicadores de worldbank_pop compartían
      #        "Population, total" y "persons" (la esperanza de vida salía en personas).
      # Los dos primeros son obligatorios; los otros cuatro se justifican en ENTREGA_02.md.
      indicators:
        - indicator_id: NY.GDP.PCAP.CD
          indicator_label: GDP per capita (current US$)
          unit: USD
        - indicator_id: SP.POP.TOTL
          indicator_label: Population, total
          unit: persons
        - indicator_id: SP.DYN.LE00.IN
          indicator_label: Life expectancy at birth, total (years)
          unit: years
        - indicator_id: SP.URB.TOTL.IN.ZS
          indicator_label: Urban population (% of total population)
          unit: "%"
        - indicator_id: NY.GDP.MKTP.CD
          indicator_label: GDP (current US$)
          unit: USD
        - indicator_id: SP.POP.TOTL.FE.IN
          indicator_label: Population, female
          unit: persons

  - id: eurostat_pop
    name: Eurostat — población (demo_pjan)
    # CAMBIO (Hito 1): de url_template (una petición por país) a url fija (una sola petición).
    # ANTES: url_template con geo={iso2}&sex=T&age=TOTAL&time=2023 → descargaba país a país.
    # AHORA: url fija sin filtros → se descarga el dataset completo y el transformer
    # se queda con sex=T, age=TOTAL y todos los años.
    url: >-
      https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/demo_pjan?format=JSON&lang=en
    format: json
    role: indicator
    transformer: eurostat_demo_pjan
    meta:
      indicator_id: demo_pjan
      aliases: [iso2]  # Eurostat usa códigos geo de dos letras (con EL y UK propios)
      indicator_label: Population on 1 January
      unit: persons

  - id: owid_life_expectancy
    name: Our World in Data — life expectancy (CSV)
    # CAMBIO (Hito 1): fuente activa y sin año fijo (serie completa).
    url: >-
      https://ourworldindata.org/grapher/life-expectancy.csv?v=1&csvType=full&useColumnShortNames=false
    format: csv
    role: indicator
    transformer: owid_life_expectancy
    meta:
      indicator_id: life_expectancy
      aliases: [iso3]
      indicator_label: Life expectancy
      unit: years
