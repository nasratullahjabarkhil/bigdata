# CAMBIO: se mantienen activas las cinco fuentes para construir el universo
# completo de países y sus indicadores, en lugar de limitarlo a cinco países.
#
# url fija     → data/raw/{id}.{format}
# url_template → data/raw/{id}_{iso2}.{format}
#   marcadores: {iso2} {iso3}


sources:
  # CAMBIO: el perfil se descarga primero y sirve como catálogo ISO2/ISO3.
  - id: countries_profile
    name: mledoze/countries (perfil e idiomas)
    url: https://raw.githubusercontent.com/mledoze/countries/master/countries.json
    format: json
    role: profile
    transformer: countries_profile

  - id: worldbank_gdp
    name: World Bank — PIB per cápita (NY.GDP.PCAP.CD)
    # CAMBIO: per_page=1000 y page=1 permiten iniciar la paginación de World Bank.
    url_template: >-
      https://api.worldbank.org/v2/country/{iso2}/indicator/NY.GDP.PCAP.CD?format=json&per_page=1000&page=1
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: NY.GDP.PCAP.CD
      aliases: [iso2, iso3]
      indicator_label: GDP per capita (current US$)
      unit: USD

  - id: eurostat_pop
    name: Eurostat — población (demo_pjan)
    url: >-
      https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/demo_pjan?format=JSON&lang=en
    format: json
    role: indicator
    transformer: eurostat_demo_pjan
    meta:
      indicator_id: demo_pjan
      aliases: [iso2, iso3]
      indicator_label: Population on 1 January
      unit: persons

  - id: owid_life_expectancy
    name: Our World in Data — life expectancy (CSV)
    url: >-
      https://ourworldindata.org/grapher/life-expectancy.csv?v=1&csvType=full&useColumnShortNames=false
    format: csv
    role: indicator
    transformer: owid_life_expectancy
    meta:
      indicator_id: life_expectancy
      aliases: [iso2, iso3]
      indicator_label: Life expectancy
      unit: years

  - id: worldbank_pop
    name: World Bank — población total (SP.POP.TOTL)
    url_template: >-
      https://api.worldbank.org/v2/country/{iso2}/indicator/{indicator_id}?format=json&per_page=1000&page=1
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: SP.POP.TOTL
      indicator_ids:
        - SP.POP.TOTL
        - SP.DYN.LE00.IN
        - SP.URB.TOTL.IN.ZS
        - NY.GDP.MKTP.CD
        - SP.POP.TOTL.FE.IN
      indicator_label: Population, total
      unit: persons
