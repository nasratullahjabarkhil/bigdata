name: Hito 1 — comprobaciones

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    name: pytest (Hito 1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Hito 1
        run: pytest -q tests/hito1
